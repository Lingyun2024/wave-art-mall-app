<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base" content="" />
    <title>登入｜全棧範本</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="js/tailwind-config.js"></script>
    <script src="js/api.js"></script>
    <style>
      body { background: #141314; color: #e5e2e2; font-family: Manrope, "Noto Sans TC", sans-serif; }
      .card { background: #1c1b1c; border: 1px solid #46464b; }
      .field { background: #201f20; border: 1px solid #46464b; color: #e5e2e2; }
      .field:focus { outline: none; border-color: #e9c349; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body class="flex min-h-screen items-center justify-center px-4">
    <div class="card w-full max-w-md rounded-xl p-8">
      <h1 class="font-display text-3xl text-secondary">登入</h1>
      <p class="mt-1 text-xs text-on-surface-variant">任務管理全棧範本</p>

      <div id="notice" class="mt-4 hidden rounded-lg border border-secondary bg-secondary-container/20 px-3 py-2 text-sm"></div>

      <form id="form-login" class="mt-6 grid gap-4">
        <div>
          <label for="email" class="mb-1 block text-xs uppercase tracking-widest text-on-surface-variant">Email</label>
          <input id="email" type="email" autocomplete="username" required class="field w-full rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label for="password" class="mb-1 block text-xs uppercase tracking-widest text-on-surface-variant">密碼</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            class="field w-full rounded-lg px-3 py-2 text-sm"
          />
        </div>
        <label class="flex items-center gap-2 text-xs text-on-surface-variant">
          <input id="remember" type="checkbox" class="rounded border-outline-variant bg-surface-container" />
          記住我（把刷新憑證存在 localStorage）
        </label>
        <button
          id="btn-submit"
          type="submit"
          class="rounded-lg bg-secondary px-5 py-2 text-sm font-semibold text-on-secondary hover:bg-secondary-fixed"
        >
          登入
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-on-surface-variant">
        還沒有帳號？
        <a href="register.html" class="text-secondary hover:underline">立即註冊</a>
      </p>

      <div class="mt-6 rounded-lg border border-outline-variant p-3 text-xs text-on-surface-variant">
        <p class="mb-1 text-secondary">示範帳號（先跑過 npm run seed）</p>
        <p>管理員：admin@example.com</p>
        <p>會員　：member@example.com</p>
        <p>密碼　：Passw0rd!demo</p>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var params = new URLSearchParams(location.search);
        if (params.get("notice") === "session-expired") {
          var n = document.getElementById("notice");
          n.textContent = "登入已過期，請重新登入";
          n.classList.remove("hidden");
        }

        document.getElementById("form-login").addEventListener("submit", async function (e) {
          e.preventDefault();
          var btn = document.getElementById("btn-submit");
          btn.disabled = true;
          btn.textContent = "登入中…";

          var r = await API.auth.login(
            {
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            },
            document.getElementById("remember").checked
          );

          btn.disabled = false;
          btn.textContent = "登入";

          if (!r.ok) {
            API.toast(r.message, "error");
            return;
          }
          var next = params.get("next");
          location.href = next && /^[\w.-]+\.html$/.test(next) ? next : "index.html";
        });

        // 已登入就直接進去
        (async function () {
          var ok = await API.refreshSession();
          if (ok) {
            var me = await API.auth.me();
            if (me.ok) location.href = "index.html";
          }
        })();
      })();
    </script>
  </body>
</html>
