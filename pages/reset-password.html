<!DOCTYPE html>
<html class="dark" lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>重設密碼 | WAVE ART MALL</title>

<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#020203" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/material-symbols.css">
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/style.css" />

<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 gradient-mesh">

<main class="max-w-md w-full py-16">
  <div class="text-center mb-10">
    <a href="../index.html" class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-widest text-secondary">WAVE ART MALL</a>
    <p class="font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest mt-2">高端藝術交易平台</p>
  </div>

  <div class="glass-card rounded-2xl p-8 md:p-10">
    <h1 class="text-center font-headline text-2xl text-starlight-white mb-2">重設密碼</h1>
    <p class="text-center text-on-surface-variant text-sm mb-8">請輸入您的新密碼</p>

    <form id="reset-form" class="space-y-6">
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">新密碼</label>
        <input required id="reset-password" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="至少 6 個字元" />
      </div>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">確認新密碼</label>
        <input required id="reset-password-confirm" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="請再輸入一次" />
      </div>
      <button type="submit" id="btn-reset" class="w-full bg-secondary text-void-black font-bold py-4 rounded transition-all hover:shadow-[0_0_20px_rgba(233,195,73,0.4)] active:scale-[0.98] uppercase tracking-[0.15em] font-label-sm">
        重設密碼
      </button>
    </form>
  </div>

  <div class="text-center mt-8">
    <a href="../index.html" class="font-label-sm text-xs text-on-surface-variant hover:text-secondary transition-colors">← 回到首頁</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script>
  /*
    =========================================================
    重設密碼頁专属逻辑
    ---------------------------------------------------------
    使用者從「忘記密碼」信件中的連結進入本頁時，
    URL 會帶有 Supabase 的 session token（在網址 # 後面）。
    supabaseClient.js 初始化時已自動把這個 token 解析並建立登入狀態，
    所以這裡直接呼叫 updateUser({ password }) 就能把密碼改掉。
  */

  async function handleReset(e) {
    e.preventDefault();
    const pw = document.getElementById("reset-password").value;
    const pwConfirm = document.getElementById("reset-password-confirm").value;
    const btn = document.getElementById("btn-reset");

    if (pw !== pwConfirm) {
      showToast("兩次輸入的密碼不一致", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "重設中...";

    // 確認是從信件連結進來（URL 帶有有效 session），否則不允許改密碼
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      showToast("連線已失效，請重新從信件中的連結進入本頁", "error");
      btn.disabled = false;
      btn.textContent = "重設密碼";
      return;
    }

    try {
      const { error } = await supabaseClient.auth.updateUser({ password: pw });
      if (error) throw error;
      showToast("密碼已成功重設！即將為您登入...");
      setTimeout(() => { window.location.href = "../index.html"; }, 1500);
    } catch (err) {
      console.error("[handleReset] 重設密碼失敗:", err);
      showToast("重設失敗：" + (err.message || "請稍後再試"), "error");
      btn.disabled = false;
      btn.textContent = "重設密碼";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("reset-form").addEventListener("submit", handleReset);
  });
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.warn("Service Worker 註冊失敗：", err);
    });
  }
</script>
</body>
</html>
