    <!-- 引入 Supabase 和项目脚本 -->

    <script>
      /*
    =========================================================
    holiday-form.html —— S3 填寫身分資料 / 結帳頁
    由 holiday-entry.html 的方案卡片帶入 ?plan=xxx&identity=yyy 進入。
    依方案動態顯示身分標題與價格，填寫後加入購物車導向 cart.html。
    =========================================================
  */

      // 六個方案的定價與顯示資訊（原功德金 / 特優價）
      const PLANS = {
        personal: {
          name: "個人者乎",
          icon: "../assets/identity/personal.png",
          orig: 7700,
          special: 770,
          sub: "[個人者乎] 代以特赦者並具有其",
          blessing: "個人者之 冤冤 仇仇 恨恨 殺殺 債債 孽孽 特特 赦赦",
        },
        family: {
          name: "家庭者乎",
          icon: "../assets/identity/family.png",
          orig: 33000,
          special: 11000,
          sub: "[家庭者乎] 代以特赦者並具有其",
          blessing: "家庭者之 冤冤 仇仇 恨恨 殺殺 債債 孽孽 特特 赦赦",
        },
        business: {
          name: "事業者乎",
          icon: "../assets/identity/business.png",
          orig: 77000,
          special: 11000,
          sub: "[事業者乎] 代以特赦者並具有其",
          blessing: "事業者之 冤冤 仇仇 恨恨 殺殺 債債 孽孽 特特 赦赦",
        },
        society: {
          name: "社會者乎",
          icon: "../assets/identity/society.png",
          orig: 77000,
          special: 11000,
          sub: "[社會者乎] 代以特赦者並具有其",
          blessing: "社會之特赦沁身靈 助助 和解 共生 共存 安生 安態",
        },
        savior: {
          name: "救世(主)者乎",
          icon: "../assets/identity/savior.png",
          orig: 77000,
          special: 11000,
          sub: "[救世(主)者乎] 代以特赦者並具有其",
          blessing:
            "救世主(者)之沁身靈特赦 助助其 修行 修練 修圓 精進 超越 突破 A006 A006 A007 A007 煞煞",
        },
      };

      const COMMON_TAGS = ["主天之", "主地之", "主人之", "主淵之", "主源之", "主控之"];
      const COMMON_NOTE = "尤其主道之・主德之者方可 代以特赦之 (切記!! 切記!!)";

      // TODO: 替換為 Supabase products 表中「七七地赦」真實商品 ID
      const HOLIDAY_PRODUCT_ID = 999;

      function getPlanKey() {
        const plan = (getQueryParam("plan") || "personal").toLowerCase();
        return PLANS[plan] ? plan : "personal";
      }

      function renderPlan() {
        const key = getPlanKey();
        const p = PLANS[key];

        document.getElementById("nav-title").textContent = "填寫身分資料 - " + p.name;
        document.title = "WAVE ART MALL - 填寫身分資料 - " + p.name;
        const blessingEl = document.getElementById("plan-blessing");
        if (key === "savior") {
          blessingEl.innerHTML =
            '救世主(者)之沁身靈特赦 助助其 修行 修練 修圓 精進 超越 突破 <span class="savior-inline-glyphs">&#xA006;&#xA006;&#xA007;&#xA007;</span> 煞煞';
        } else {
          blessingEl.textContent = p.blessing;
        }
        document.getElementById("plan-sub").textContent = p.sub;

        // 根據 identity 參數更新圖片
        const identity = getQueryParam("identity") || key;
        const iconEl = document.getElementById("identity-icon");
        if (p.icon.startsWith("../assets/")) {
          iconEl.src = p.icon;
        } else {
          iconEl.src = `../assets/identity/${identity}.png`;
        }

        const tagsEl = document.getElementById("plan-tags");
        tagsEl.innerHTML = "";
        COMMON_TAGS.forEach((t) => {
          const span = document.createElement("span");
          span.className = "";
          span.textContent = t;
          tagsEl.appendChild(span);
        });
        document.getElementById("plan-note").textContent = COMMON_NOTE;

        document.getElementById("summary-label").textContent = "身分驗證（" + p.name + " 特優價）";
        document.getElementById("summary-price").textContent = formatPrice(p.special);
        document.getElementById("summary-total").textContent = formatPrice(p.special);
      }

      function goBack() {
        window.location.href = "holiday-entry.html";
      }

      // 確認結帳：驗證表單 → 登入檢查 → 寫入 orders 表 → 導向訂單確認頁
      async function confirmCheckout(event) {
        if (event) event.preventDefault();

        const fields = [
          ["f-name", "代表人姓名"],
          ["f-age", "虛歲"],
          ["f-phone", "電話"],
          ["f-address", "地址"],
        ];
        const missing = fields.filter(([id]) => !document.getElementById(id).value.trim());
        const formError = document.getElementById("form-error");
        fields.forEach(([id]) => document.getElementById(id).classList.remove("field-invalid"));

        if (missing.length) {
          const missingLabels = missing.map(([, label]) => label).join("、");
          formError.textContent = `沒有填寫基本資料，此筆無效。請填寫：${missingLabels}`;
          formError.classList.add("is-visible");
          missing.forEach(([id]) => document.getElementById(id).classList.add("field-invalid"));
          document.getElementById(missing[0][0]).focus();
          showToast(`沒有填寫基本資料，此筆無效：${missingLabels}`, "error");
          return;
        }

        formError.textContent = "";
        formError.classList.remove("is-visible");
        const name = document.getElementById("f-name").value.trim();
        const age = document.getElementById("f-age").value.trim();
        const phone = document.getElementById("f-phone").value.trim();
        const address = document.getElementById("f-address").value.trim();

        // 地赦下單需登入且 Email 已驗證，才能寫入 orders 表
        const user = await requireLogin("holiday-form.html" + window.location.search);
        if (!user) return;

        const key = getPlanKey();
        const p = PLANS[key];
        const identity = getQueryParam("identity") || key;
        const agent = document.getElementById("f-agent").value.trim();

        const basePayload = {
          user_id: user.id,
          status: "待處理",
          subtotal: p.special,
          shipping_fee: 0,
          tax: 0,
          discount: 0,
          total_amount: p.special,
          recipient_name: name,
          phone: phone,
          email: user.email,
          city: "",
          district: "",
          street_address: address,
          payment_method: "bank_transfer",
          payment_status: "pending",
          customer_note: `${p.name} 特赦方案｜身分:${identity}｜虛歲:${age}｜代理人:${agent || "無"}`,
        };
        const holidayPayload = {
          ...basePayload,
          identity_type: identity,
          age: /^\d+$/.test(age) ? parseInt(age, 10) : null,
          agent_name: agent || null,
        };

        try {
          let newOrder;
          let orderErr;
          ({ data: newOrder, error: orderErr } = await supabaseClient
            .from("orders")
            .insert(holidayPayload)
            .select()
            .single());

          if (orderErr && (orderErr.code === "42703" || orderErr.code === "PGRST204")) {
            ({ data: newOrder, error: orderErr } = await supabaseClient
              .from("orders")
              .insert(basePayload)
              .select()
              .single());
          }

          if (orderErr) throw orderErr;

          // 收集訂單資料供訂單確認頁讀取（含資料庫回傳的真實訂單編號）
          const orderData = {
            orderId: newOrder.id,
            orderNumber: newOrder.order_number,
            userId: user.id,
            name: name,
            age: age,
            phone: phone,
            address: address,
            agent: agent,
            identity: identity,
            plan: key,
            planName: p.name,
            planData: p,
            specialPrice: p.special,
            createdAt: new Date().toISOString(),
          };

          localStorage.setItem("orderData", JSON.stringify(orderData));
          window.location.href = "order-confirm.html";
        } catch (e) {
          console.error("[confirmCheckout] 建立訂單失敗:", e);
          showToast("訂單建立失敗：" + (e.message || "請稍後再試"), "error");
        }
      }

      document.getElementById("btn-confirm").addEventListener("click", confirmCheckout);

      // 欄位聚焦高亮（與 MD_S2 一致的微互動）
      document.querySelectorAll("#identity-form input").forEach((input) => {
        input.addEventListener("focus", () => {
          const label = input.parentElement.querySelector("label");
          if (label) label.classList.add("text-neon-cyan");
        });
        input.addEventListener("blur", () => {
          const label = input.parentElement.querySelector("label");
          if (label) label.classList.remove("text-neon-cyan");
        });
      });

      // 页面载入时立即检查登录状态，避免用户填写大量资料后才发现需要登录
      // 这是基于个资法的要求：所有需要输入个人资料的页面都必须先登录
      document.addEventListener("DOMContentLoaded", async () => {
        const user = await requireLogin("holiday-form.html" + window.location.search);
        if (!user) return; // requireLogin 会自动跳转到登录页面
        
        renderPlan();
      });
      // 若 DOMContentLoaded 已觸發（腳本置底），仍確保渲染一次
      if (document.readyState !== "loading") {
        (async () => {
          const user = await requireLogin("holiday-form.html" + window.location.search);
          if (!user) return;
          renderPlan();
        })();
      }
    </script>

    <!-- PWA Service Worker 註冊（404 已由根目錄 sw.js 補齊） -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("../sw.js").catch((err) => {
          console.warn("Service Worker 註冊失敗:", err);
        });
      }
    </script>
  </body>
</html>
