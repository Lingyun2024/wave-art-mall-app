    <script>
      /*
    =========================================================
    訂單評價頁
    =========================================================
    這一段負責：
    1. 從網址取出 order_id（由 order-history.html 帶入）
    2. 確認已登入，沒登入就先記住回跳位置再導向登入頁
    3. 讀取該訂單的 order_items，列出每一件商品
    4. 讀取自己已对该訂單留下的評價，已評過的商品直接顯示結果
    5. 送出評價到 reviews 表（product_id / user_id / order_id / rating / comment）

    資料表結構（實測線上）：
      reviews(id, product_id, user_id, order_id, rating, comment, created_at)
    =========================================================
  */

      const orderId = new URLSearchParams(window.location.search).get("order_id");
      let currentUser = null;
      let orderItems = [];
      const reviewedMap = new Map();

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char]
        );
      }

      function showToast(message, type) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "toast " + (type === "error" ? "toast-error" : "toast-success");
        window.setTimeout(() => {
          toast.className = "toast hidden";
        }, 3200);
      }

      function showMessage(text) {
        document.getElementById("loading").classList.add("hidden");
        const box = document.getElementById("page-message");
        box.textContent = text;
        box.classList.remove("hidden");
      }

      function starsHtml(rating, disabled) {
        let html = '<div class="star-picker" data-rating="' + rating + '">';
        for (let value = 1; value <= 5; value++) {
          const filled = value <= rating ? "filled star-filled" : "star-empty";
          html +=
            '<button type="button" data-value="' +
            value +
            '"' +
            (disabled ? " disabled" : "") +
            ' aria-label="' +
            value +
            ' 星"><span class="material-symbols-outlined ' +
            filled +
            '">star</span></button>';
        }
        return html + "</div>";
      }

      function renderItems() {
        const list = document.getElementById("review-list");
        document.getElementById("loading").classList.add("hidden");

        if (!orderItems.length) {
          showMessage("這筆訂單沒有可評價的商品。");
          return;
        }

        list.innerHTML = orderItems
          .map((item, index) => {
            const existing = reviewedMap.get(item.product_id);
            const isDone = Boolean(existing);
            const image = item.product_image_url
              ? '<img src="' +
                escapeHtml(item.product_image_url) +
                '" alt="" class="w-16 h-16 object-cover rounded-lg border border-outline-variant/40" />'
              : '<span class="material-symbols-outlined text-outline text-3xl">image</span>';

            return (
              '<div class="review-card glass-card p-5 rounded-lg' +
              (isDone ? " is-done" : "") +
              '" data-index="' +
              index +
              '">' +
              '<div class="flex gap-4">' +
              '<div class="shrink-0">' +
              image +
              "</div>" +
              '<div class="flex-1 min-w-0">' +
              '<p class="text-starlight-white text-sm mb-1 truncate">' +
              escapeHtml(item.product_name || "商品") +
              "</p>" +
              '<p class="font-label-sm text-[11px] text-on-surface-variant mb-3">數量 ' +
              escapeHtml(item.quantity) +
              "</p>" +
              (isDone
                ? '<div class="flex items-center gap-3">' +
                  starsHtml(existing.rating, true) +
                  '<span class="done-badge bg-secondary/15 text-secondary">已評價</span>' +
                  "</div>" +
                  (existing.comment
                    ? '<p class="text-xs text-on-surface-variant mt-3 whitespace-pre-wrap">' +
                      escapeHtml(existing.comment) +
                      "</p>"
                    : "")
                : starsHtml(0, false) +
                  '<textarea rows="3" maxlength="500" class="review-comment w-full mt-3 bg-transparent border border-outline-variant/50 rounded-lg p-3 text-sm text-on-surface placeholder:text-outline focus:border-neon-cyan focus:outline-none" placeholder="分享您的使用心得（選填，500 字內）"></textarea>' +
                  '<div class="flex items-center justify-end gap-3 mt-3">' +
                  '<button type="button" class="submit-review font-label-sm text-[11px] uppercase tracking-widest px-4 py-2 rounded border border-neon-cyan/60 text-neon-cyan hover:bg-neon-cyan/10 transition-colors">送出評價</button>' +
                  "</div>") +
              "</div></div></div>"
            );
          })
          .join("");
      }

      function setRating(picker, value) {
        picker.dataset.rating = String(value);
        picker.querySelectorAll("button").forEach((btn) => {
          const star = btn.querySelector(".material-symbols-outlined");
          const on = Number(btn.dataset.value) <= value;
          star.className =
            "material-symbols-outlined " + (on ? "filled star-filled" : "star-empty");
        });
      }

      async function submitReview(card) {
        const index = Number(card.dataset.index);
        const item = orderItems[index];
        const picker = card.querySelector(".star-picker");
        const rating = Number(picker.dataset.rating || 0);
        const commentEl = card.querySelector(".review-comment");
        const comment = commentEl ? commentEl.value.trim() : "";

        if (rating < 1) {
          showToast("請先選擇 1 到 5 顆星", "error");
          return;
        }

        const button = card.querySelector(".submit-review");
        button.disabled = true;
        button.textContent = "送出中…";

        const { error } = await supabaseClient.from("reviews").insert({
          product_id: item.product_id,
          user_id: currentUser.id,
          order_id: orderId,
          rating: rating,
          comment: comment || null,
        });

        if (error) {
          console.error("[submitReview] 送出評價失敗:", error);
          showToast("評價送出失敗，請稍後再試", "error");
          button.disabled = false;
          button.textContent = "送出評價";
          return;
        }

        reviewedMap.set(item.product_id, { rating: rating, comment: comment });
        showToast("感謝您的評價！");
        renderItems();
      }

      document.addEventListener("click", (event) => {
        const starBtn = event.target.closest(".star-picker button");
        if (starBtn && !starBtn.disabled) {
          setRating(starBtn.closest(".star-picker"), Number(starBtn.dataset.value));
          return;
        }
        const submitBtn = event.target.closest(".submit-review");
        if (submitBtn) {
          submitReview(submitBtn.closest(".review-card"));
        }
      });

      async function initReviewPage() {
        if (!orderId) {
          showMessage("缺少訂單編號，請從「歷史訂單」進入本頁。");
          return;
        }

        currentUser = await getCurrentUser();
        if (!currentUser) {
          localStorage.setItem("wave_redirect_after_login", window.location.href);
          window.location.href = "auth.html";
          return;
        }

        const { data: order, error: orderError } = await supabaseClient
          .from("orders")
          .select("id, order_number, status, created_at")
          .eq("id", orderId)
          .single();

        if (orderError || !order) {
          showMessage("找不到這筆訂單，或您沒有檢視權限。");
          return;
        }

        if (order.status === "已取消") {
          showMessage("此訂單已取消，無法評價。");
          return;
        }

        document.getElementById("order-meta").textContent =
          "訂單編號 " + (order.order_number || order.id.slice(0, 8));

        const { data: items, error: itemsError } = await supabaseClient
          .from("order_items")
          .select("product_id, product_name, product_image_url, quantity")
          .eq("order_id", orderId);

        if (itemsError) {
          showMessage("讀取訂單商品失敗：" + itemsError.message);
          return;
        }

        orderItems = items || [];

        const { data: mine } = await supabaseClient
          .from("reviews")
          .select("product_id, rating, comment")
          .eq("order_id", orderId)
          .eq("user_id", currentUser.id);

        (mine || []).forEach((row) => reviewedMap.set(row.product_id, row));

        renderItems();
      }

      document.addEventListener("DOMContentLoaded", initReviewPage);
    </script>
