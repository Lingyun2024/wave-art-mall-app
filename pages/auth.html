<!DOCTYPE html>
<html class="dark" lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>登入 / 註冊 | WAVE ART MALL</title>

<!-- ============================================
     PWA 設定（讓網站可以「加到主畫面」變成手機 App 圖示）
     ============================================ -->
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#020203" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/material-symbols.css">
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/style.css" />

<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
  /* 登入/注册的分页标签切换效果 */
  .tab-btn.active {
    color: #e9c349;
    border-color: #e9c349;
  }
  .tab-btn {
    color: #919095;
    border-bottom: 2px solid transparent;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 gradient-mesh">

<main class="max-w-md w-full py-16">
  <div class="text-center mb-10">
    <a href="../index.html" class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-widest text-secondary">WAVE ART MALL</a>
    <p class="font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest mt-2">高端藝術交易平台</p>
  </div>

  <div class="glass-card rounded-2xl p-8 md:p-10">
    <!-- 從其他頁面被導回時的常駐提示（例如 requireLogin 的 notice=verify-email） -->
    <div id="auth-notice" class="hidden mb-6 rounded-lg px-4 py-3 text-sm leading-relaxed"
         style="border:1px solid #ffb4ab; background:rgba(255,180,171,0.08); color:#ffdad6;"></div>

    <!-- 登入 / 注册 分页标签 -->
    <div id="tabs-bar" class="flex border-b border-secondary/20 mb-8">
      <button id="tab-login" class="tab-btn active flex-1 py-3 font-label-sm text-sm uppercase tracking-widest transition-colors">登入</button>
      <button id="tab-signup" class="tab-btn flex-1 py-3 font-label-sm text-sm uppercase tracking-widest transition-colors">註冊</button>
    </div>

    <!-- 登入表单 -->
    <form id="login-form" class="space-y-6">
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">電子郵件</label>
        <input required id="login-email" type="email" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="you@example.com" />
      </div>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">密碼</label>
        <input required id="login-password" type="password" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="請輸入密碼" />
      </div>
      <button type="submit" id="btn-login" class="w-full bg-secondary text-void-black font-bold py-4 rounded transition-all hover:shadow-[0_0_20px_rgba(233,195,73,0.4)] active:scale-[0.98] uppercase tracking-[0.15em] font-label-sm">
        登入
      </button>
      <!-- 忘記密碼：點擊後用上方輸入的 email 寄出重設密碼信件 -->
      <button type="button" id="btn-forgot-password" class="w-full text-center text-xs text-neon-cyan hover:text-secondary transition-colors">
        忘記密碼？
      </button>
      <!-- 若 Supabase 開啟電子郵件確認，使用者可直接用這裡補寄驗證信。 -->
      <button type="button" id="btn-resend-confirmation" class="w-full text-center text-xs text-neon-cyan hover:text-secondary transition-colors">
        尚未收到驗證信？重新寄送
      </button>
    </form>

    <!-- 注册表单（预设隐藏） -->
    <form id="signup-form" class="space-y-6 hidden">
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">電子郵件</label>
        <input required id="signup-email" type="email" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="you@example.com" />
      </div>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">密碼</label>
        <input required id="signup-password" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="至少 6 個字元" />
      </div>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">確認密碼</label>
        <input required id="signup-password-confirm" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="請再輸入一次密碼" />
      </div>
      <button type="submit" id="btn-signup" class="w-full bg-secondary text-void-black font-bold py-4 rounded transition-all hover:shadow-[0_0_20px_rgba(233,195,73,0.4)] active:scale-[0.98] uppercase tracking-[0.15em] font-label-sm">
        建立帳戶
      </button>
    </form>

    <!-- 重設密碼表單（預設隱藏；點擊重設信件連結進來時才顯示） -->
    <form id="reset-form" class="space-y-6 hidden">
      <p class="text-center text-on-surface-variant text-sm mb-2">請設定您的新密碼</p>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">新密碼</label>
        <input required id="reset-password" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="至少 6 個字元" />
      </div>
      <div>
        <label class="font-label-sm text-xs text-on-surface-variant uppercase block mb-2">確認新密碼</label>
        <input required id="reset-password-confirm" type="password" minlength="6" class="w-full bg-void-black border border-secondary/30 rounded px-4 py-3 text-starlight-white input-glow" placeholder="請再輸入一次密碼" />
      </div>
      <button type="submit" id="btn-reset-password" class="w-full bg-secondary text-void-black font-bold py-4 rounded transition-all hover:shadow-[0_0_20px_rgba(233,195,73,0.4)] active:scale-[0.98] uppercase tracking-[0.15em] font-label-sm">
        設定新密碼
      </button>
    </form>
  </div>

  <div class="text-center mt-8">
    <a href="../index.html" class="font-label-sm text-xs text-on-surface-variant hover:text-secondary transition-colors">← 回到首頁</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script>
  /*
    =========================================================
    登入注册页专属逻辑
    =========================================================
    这一段负责：
    1. 切换「登入」/「注册」两个分页表单的显示
    2. 登入：呼叫 supabase.auth.signInWithPassword()
    3. 注册：呼叫 supabase.auth.signUp()（不需要做 email 验证，
       所以注册成功后通常会直接拿到 session，可以视为已登入）
    4. 登入/注册成功后，检查 localStorage 里有没有记录「原本要去的页面」，
       有的话就导回去，没有就导回首页
  */

  // -----------------------------------------------------
  // 驗證信 / 重設密碼信的「導回網址」
  // -----------------------------------------------------
  // 一定要用正式站的網址，而且必須存在於 Supabase 後台的 Redirect URLs 白名單，
  // 否則信件連結會失效。不可用 window.location.href：
  // 本機測試時會變成 file:// 或 127.0.0.1，Supabase 會直接拒絕該網址。
  const AUTH_REDIRECT_URL = "https://wave-art-mall.vercel.app/pages/auth.html";

  // -----------------------------------------------------
  // 被其他頁面導回本頁時，顯示網址上的提示參數
  // -----------------------------------------------------
  // 情境：requireLogin() 發現使用者沒登入或沒驗證 Email，
  // 會導到 auth.html?notice=verify-email，但先前本頁沒有讀這個參數，
  // 使用者只會被丟回登入頁、完全不知道發生什麼事。
  function showNoticeFromQuery() {
    const MESSAGES = {
      "verify-email": "您的電子郵件尚未完成驗證。請到信箱點擊驗證連結後再登入；若沒收到，請按下方「尚未收到驗證信？重新寄送」。"
    };
    const notice = new URLSearchParams(window.location.search).get("notice");
    const el = document.getElementById("auth-notice");
    if (!notice || !el) return;
    const msg = MESSAGES[notice];
    if (!msg) return;
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  // -----------------------------------------------------
  // 分页标签切换（登入 <-> 注册）
  // -----------------------------------------------------
  function switchTab(target) {
    const isLogin = target === "login";
    document.getElementById("tab-login").classList.toggle("active", isLogin);
    document.getElementById("tab-signup").classList.toggle("active", !isLogin);
    document.getElementById("login-form").classList.toggle("hidden", !isLogin);
    document.getElementById("signup-form").classList.toggle("hidden", isLogin);
  }

  // -----------------------------------------------------
  // 登入成功 / 注册成功后，使用統一回跳工具（依角色分流）
  // -----------------------------------------------------
  async function redirectAfterAuth() {
    const user = await getCurrentUser();
    if (!user) {
      // 理論上不會發生，但保險起見還是回首頁
      window.location.href = "../index.html";
      return;
    }

    // 使用 auth.js 的統一回跳（會依角色分流）
    await redirectAfterLogin(user);
  }

  // -----------------------------------------------------
  // 处理登入表单送出
  // -----------------------------------------------------
  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const btn = document.getElementById("btn-login");

    btn.disabled = true;
    btn.textContent = "登入中...";

    try {
      // 这一段是呼叫 Supabase Auth 的登入功能，把帐号密码送过去验证
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;

      showToast("登入成功！");
      setTimeout(redirectAfterAuth, 500);
    } catch (err) {
      console.error("[handleLogin] 登入失败:", err);
      showToast(translateAuthError(err.message), "error");
      btn.disabled = false;
      btn.textContent = "登入";
    }
  }

  // -----------------------------------------------------
  // 处理注册表单送出
  // -----------------------------------------------------
  async function handleSignup(e) {
    e.preventDefault();
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;
    const passwordConfirm = document.getElementById("signup-password-confirm").value;
    const btn = document.getElementById("btn-signup");

    // 简单验证两次密码是否一致
    if (password !== passwordConfirm) {
      showToast("兩次輸入的密碼不一致", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "建立帳戶中...";
    let shouldKeepButtonDisabled = false;

    try {
      // 这一段是呼叫 Supabase Auth 的注册功能，建立一个新的帐号
      const { data, error } = await Promise.race([
        supabaseClient.auth.signUp({
          email,
          password,
          // 明確指定驗證信連結要導回哪裡，不要依賴後台 Site URL 的預設值
          options: { emailRedirectTo: AUTH_REDIRECT_URL }
        }),
        new Promise((_, reject) => {
          setTimeout(() => reject(new Error("註冊請求逾時，請稍後再試")), 15000);
        })
      ]);
      if (error) throw error;

      if (Array.isArray(data.user?.identities) && data.user.identities.length === 0) {
        document.getElementById("login-email").value = email;
        switchTab("login");
        showToast("此電子郵件已被註冊，請直接登入；若尚未驗證可補寄驗證信", "error");
        return;
      }

      // 因为不需要 email 验证，注册成功后通常已经自动登入（拿到 session）
      if (data.session) {
        shouldKeepButtonDisabled = true;
        showToast("註冊成功，已自動登入！");
        setTimeout(redirectAfterAuth, 500);
      } else {
        // 少数情况下 Supabase 项目仍设定需要验证邮件，这里给使用者提示
        document.getElementById("login-email").value = email;
        showToast("註冊成功，請查看信箱完成驗證後再登入");
        switchTab("login");
      }
    } catch (err) {
      console.error("[handleSignup] 注册失败:", err);
      // 「逾時」多半是 Supabase 端寄送驗證信失敗（實測會卡約 35 秒）。
      // 此時帳號其實「還沒建立」，必須講清楚，否則使用者會以為已註冊成功、
      // 之後登入卻一直失敗，而卡在「登入↔註冊」的迴圈裡。
      if ((err?.message || "").includes("註冊請求逾時")) {
        showToast("註冊未完成：伺服器無回應，您的帳號尚未建立。請稍後再試，或聯絡管理員。", "error");
      } else {
        showToast(translateAuthError(err.message), "error");
      }
    } finally {
      if (!shouldKeepButtonDisabled) {
        btn.disabled = false;
        btn.textContent = "建立帳戶";
      }
    }
  }

  // -----------------------------------------------------
  // 補寄驗證信：手機註冊後若帳號尚未確認，可輸入註冊用信箱後按這個按鈕。
  // -----------------------------------------------------
  async function resendConfirmationEmail() {
    const email = document.getElementById("login-email").value.trim();
    if (!email) {
      showToast("請先在登入欄位輸入您的電子郵件", "error");
      document.getElementById("login-email").focus();
      return;
    }
    const button = document.getElementById("btn-resend-confirmation");
    button.disabled = true;
    button.textContent = "寄送中...";
    try {
      const timeoutMs = 15000;
      const timeoutPromise = new Promise((_, reject) => {
        setTimeout(() => reject(new Error("補寄驗證信逾時")), timeoutMs);
      });

      const { error } = await Promise.race([
        supabaseClient.auth.resend({
          type: "signup",
          email,
          options: { emailRedirectTo: AUTH_REDIRECT_URL }
        }),
        timeoutPromise
      ]);
      if (error) throw error;
      showToast("驗證信已寄出，請到信箱點擊確認連結後再登入");
    } catch (err) {
      console.error("[resendConfirmationEmail] 補寄驗證信失敗:", err);
      showToast(translateAuthError(err.message), "error");
    } finally {
      button.disabled = false;
      button.textContent = "尚未收到驗證信？重新寄送";
    }
  }

  // -----------------------------------------------------
  // 忘記密碼：呼叫 Supabase Auth 寄出「重設密碼」信件。
  // 信件裡的連結會導向本頁（auth.html）並帶上重設憑證，進入頁面後自動顯示「設定新密碼」表單。
  // （注意：此功能依賴 Supabase 專案的「電子郵件寄送」正常運作；
  //   免費版會從 supabase.co 網域寄出，可能進垃圾郵件，需在後台確認。）
  // -----------------------------------------------------
  async function handleForgotPassword() {
    const email = document.getElementById("login-email").value.trim();
    if (!email) {
      showToast("請先在上方輸入您的電子郵件", "error");
      document.getElementById("login-email").focus();
      return;
    }
    const button = document.getElementById("btn-forgot-password");
    button.disabled = true;
    button.textContent = "寄送中...";
    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: AUTH_REDIRECT_URL
      });
      if (error) throw error;
      showToast("重設密碼信件已寄出，請到信箱點擊連結（若沒看到請檢查垃圾郵件）");
    } catch (err) {
      console.error("[handleForgotPassword] 寄送重設密碼信失敗:", err);
      showToast(translateAuthError(err.message), "error");
    } finally {
      button.disabled = false;
      button.textContent = "忘記密碼？";
    }
  }

  // -----------------------------------------------------
  // 重設密碼（點擊信件連結進入本頁時觸發）
  // -----------------------------------------------------
  async function handlePasswordRecovery() {
    const hash = window.location.hash;
    // Supabase 重設連結會在網址後方帶上 #access_token=...&type=recovery
    if (!hash.includes("type=recovery") || !hash.includes("access_token")) return;

    try {
      // 從網址中讀取並建立 session（這一步會把憑證寫入本地）
      const { error } = await supabaseClient.auth.getSessionFromUrl();
      if (error) throw error;

      // 隱藏登入/註冊，顯示重設表單
      document.getElementById("tabs-bar").classList.add("hidden");
      document.getElementById("login-form").classList.add("hidden");
      document.getElementById("signup-form").classList.add("hidden");
      document.getElementById("reset-form").classList.remove("hidden");
    } catch (err) {
      console.error("[handlePasswordRecovery] 處理重設連結失敗:", err);
      showToast(translateAuthError(err.message), "error");
    }
  }

  // -----------------------------------------------------
  // 送出新密碼
  // -----------------------------------------------------
  async function handleResetPassword(e) {
    e.preventDefault();
    const pw = document.getElementById("reset-password").value;
    const pwConfirm = document.getElementById("reset-password-confirm").value;
    const btn = document.getElementById("btn-reset-password");

    if (pw !== pwConfirm) {
      showToast("兩次輸入的密碼不一致", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "設定中...";
    try {
      const { error } = await supabaseClient.auth.updateUser({ password: pw });
      if (error) throw error;
      showToast("密碼已更新，請重新登入");
      setTimeout(() => { window.location.href = "../index.html"; }, 1200);
    } catch (err) {
      console.error("[handleResetPassword] 重設密碼失敗:", err);
      showToast(translateAuthError(err.message), "error");
      btn.disabled = false;
      btn.textContent = "設定新密碼";
    }
  }

  // 把 Supabase 常见的英文错误讯息翻成比较好懂的中文提示
  function translateAuthError(message) {
    if (!message) return "發生未知錯誤，請稍後再試";
    // 伺服器端寄信服務異常時，Supabase 會回 "upstream request timeout"（實測約卡 35 秒後才回）
    if (message.includes("upstream request timeout"))
      return "認證伺服器無回應，請稍後再試；若持續發生，請通知管理員檢查 Email 寄送設定";
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(message))
      return "網路連線失敗，請檢查網路後再試";
    if (message.includes("Invalid login credentials"))
      return "登入失敗：此電子郵件尚未註冊，或密碼輸入錯誤。若確定已註冊過，請按「忘記密碼？」重新設定";
    if (message.includes("Email not confirmed")) return "電子郵件尚未驗證，請到信箱點擊確認連結後再登入";
    if (message.includes("User already registered")) return "此電子郵件已被註冊過；請直接登入，或按「忘記密碼？」重新設定密碼";
    if (message.includes("Password should be at least")) return "密碼長度不足，至少需要 6 個字元";
    return message;
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("tab-login").addEventListener("click", () => switchTab("login"));
    document.getElementById("tab-signup").addEventListener("click", () => switchTab("signup"));
    document.getElementById("login-form").addEventListener("submit", handleLogin);
    document.getElementById("signup-form").addEventListener("submit", handleSignup);
    document.getElementById("btn-resend-confirmation").addEventListener("click", resendConfirmationEmail);
    document.getElementById("btn-forgot-password").addEventListener("click", handleForgotPassword);
    document.getElementById("reset-form").addEventListener("submit", handleResetPassword);
    // 若是由「重設密碼」信件連結進入，自動切換到重設表單
    handlePasswordRecovery();
    // 若被 requireLogin() 導回本頁（例如 ?notice=verify-email），顯示對應說明
    showNoticeFromQuery();
  });
</script>

<!-- ============================================
     註冊 Service Worker（讓網站支援離線快取、可安裝成 App）
     ============================================ -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.warn("Service Worker 註冊失敗：", err);
    });
  }
</script>
</body>
</html>
